<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AIAONI · 内容管理</title><link rel="stylesheet" href="/cms/style.css"><script defer src="/cms/app.js"></script></head><body>
<div id="login" class="login-wrap"><form id="login-form" class="login-card"><div class="brand">AIAONI<span>CONTENT STUDIO</span></div><h1>管理网站内容</h1><p>简体中文 · English</p><label>用户名<input name="username" autocomplete="username" value="admin" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录后台</button><p id="login-error" role="alert"></p><a href="/">返回网站 ↗</a></form></div>
<div id="studio" hidden><aside><div class="brand">AIAONI<span>CONTENT STUDIO</span></div><nav id="nav"><button data-entity="article">新闻文章</button><button data-entity="case">服务案例</button><button data-entity="biaoshi">服务项目</button><button data-entity="page">单页内容</button><button data-entity="category">栏目导航</button><button data-entity="slide_data">轮播与展示</button><button data-entity="block">内容区块</button><hr><button data-entity="media">图片资源</button><button data-entity="inquiries">访客留言</button><button data-entity="ui">界面翻译</button></nav><div class="sidebar-bottom"><a href="/" target="_blank">预览网站 ↗</a><button id="logout">退出登录</button></div></aside><main><header><div><small>WEBSITE / CONTENT</small><h1 id="section-title">新闻文章</h1></div><div><span class="locale-tag">中文 + English</span><button id="new" class="primary">＋ 新建内容</button></div></header><section id="content"><div class="toolbar"><input id="search" type="search" placeholder="搜索标题或图片名称"><button id="search-button">搜索</button><span id="count"></span></div><div id="list"></div><footer id="pager"><button id="prev">上一页</button><span id="page-number"></span><button id="next">下一页</button></footer></section></main></div>
<dialog id="editor"><form id="edit-form"><div class="editor-head"><h2 id="edit-title">编辑内容</h2><button type="button" class="icon" id="close-editor" aria-label="关闭">×</button></div><div class="tabs"><button type="button" data-locale="zh-CN" class="selected">简体中文 · 原稿</button><button type="button" data-locale="en">English · 翻译</button><a id="preview" target="_blank">预览页面 ↗</a></div><p id="translation-help" hidden>中英文共用栏目与网址。翻译可独立保存为草稿，勾选发布后在英文站使用。</p><div id="fields"></div><details><summary>更多原站字段</summary><p>结构字段保留原站命名。普通更新使用上方编辑区即可。</p><textarea id="advanced" rows="10" spellcheck="false"></textarea></details><div class="editor-actions"><label id="publish-wrap" hidden><input id="published" type="checkbox"> 发布英文翻译</label><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存内容</button></div></form></dialog><input id="upload" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,video/mp4,application/pdf" hidden><div id="toast" role="status" hidden></div>
</body></html>
