            var nowPage = 1;

            var loading = false;  //状态标记
            $(function () {

            });
            $(document.body).infinite().on("infinite", function () {               
                if (loading) return;

                    nowPage++;
                    loadData("article", nowPage, catids);
                    loading = false;
                }, 100);   //模拟延迟
            });
			   function LimitNumber(txt,idName) {
				var str = txt;
				str = str.substr(0,20) + '...' ;
				var id=document.getElementById(idName);
				id.innerText=str;
    }
 
            function getData(result) {                
                if (result != null) {
                    var html = "";
                    for (var i = 0; i < result.length; i++) {
                        var d = new Date(result[i].createtime * 1000);    //根据时间戳生成的时间对象
                        var date = (d.getFullYear()) + "-" +
                            (d.getMonth() + 1) + "-" +
                            (d.getDate());
   	html += '<li></li><a  class="news-li" href="/wap' + result[i].url + '" title="' + result[i].title + '"> <span class="Maximg"><img src="' + result[i].thumb + '"  alt="' + result[i].title + '"/> </span>  <div class="news-li-r"><h4>' + result[i].title + '</h4><p>' + result[i].description + '</p><span>' + date + '</span></div></a></li>';
					          
					}
                    $("#clist").html($("#clist").html() + html);
                    $("#clist_more").show();
                } else {
                    $("#clist_more").html("<p>暂无更多内容...</p>");
                }
                if ($("#clist").html() == "") {
                    $("#clist_more").show();
                    $("#clist_more").html("<p>暂无更多内容...</p>");
                }
            }
        </script>
