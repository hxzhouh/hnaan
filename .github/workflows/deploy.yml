name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hnaan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: hnaan_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_TEST_URL: mysql://root:ci-only-password@127.0.0.1:3306/hnaan_ci
    outputs:
      deploy-ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:node
      - run: npm run build
      - id: credentials
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ] && [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Checks passed. Set CLOUDFLARE_API_TOKEN and confirm the target account with CLOUDFLARE_DEPLOY_ENABLED=true to enable deployment."
            echo 'Cloudflare deployment is waiting for deployment credentials and target-account confirmation.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:remote
      - run: npm run deploy
      - name: Verify deployment
        run: curl --fail --retry 5 --retry-delay 5 "${SITE_URL%/}/healthz"
