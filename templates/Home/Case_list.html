<!DOCTYPE html>
<html lang="zh">

	<head>
		<include file="model:head" />
	</head>

	<body>
		<!--头部  -->
		<header>
			<include file="model:header" />
		</header>
		<!--导航-->
		<include file="model:top" />
		<!--banner-->
		<div class="zt-banner">
			<include file="model:banner" />
		</div>
		
<div style='display:none;'><h1>{$catname}</h1></div> 
		<!--内容-->
		<section>
			<!--当前位置-->
			<div class="zt-weizhi">
				<ul>
					<li><a href="/" title="{$site_name}">首页</a><span> > </span> </li>
					<li><a href="{$Categorys[120]['url']}" title="服务案例">服务案例</a><span> > </span></li>
					<li>{$catname}</li>
				</ul>
				<div class="clear"></div>
			</div>
			
			<div class="dzinb-bottom">
				<div class="dzinb-bottom-left">
					<span>标识标牌分类</span>
					<ul id="menus">
						<JW:list sql="SELECT * FROM `jzw_category` WHERE 1 and `ismenu`=1 and `parentid`=93 order by listorder asc">
							<li><a href="{$r.url}" title="{$r.catname}" data-cid="{$r.id}">{$r.catname}</a></li>
						</JW:list>

					</ul>
					<p style="box-shadow: none;">
						<a style="display:block;width:100%;height:45px;margin:0;background:none;box-shadow: none;color: #fff;" href="{$Categorys[116]['url']}">标识标牌制作</a>
					</p>
					<a href="http://p.qiao.baidu.com/cps/chat?siteId=9999511&userId=20499162" title="联系客服">
						<h1>联系客服</h1>
						<h2>{$tel}</h2>
					</a>
				</div>
				<script type="text/javascript">
                    $(function () {
                        $("#menus").find("a").each(function () {
                            if ($(this).attr("data-cid") == '{$catid}') {
                                $(this).parent().addClass("bs-active");
                            }
                        });

                    });
				</script>
				<div class="dzinb-bottom-right">
					<div class="fenlei">
						<volist name="list" id="vo">
						<div class="fenlei-in">
							<a href="{$vo.url}" title="{$vo.title}" target="_blank">
								<div class="fenlei-in-tup"><img alt="{$vo.title}" src="{$vo.thumb}" /></div>
								<p>{$vo.title}</p>
							</a>
						</div>
						</volist>

					</div>
					</div>

				</div>
				<div style="clear: both;"></div>
			</div>
			
			<!--分页器-->
			<div class="width1200 fenye" style="margin: 80px auto;">
				<ul>
					{$pages}
				</ul>
				<div class="clear"></div>
			</div>
		</section>
		<!--底部导航-->
		<include file="model:foot" />
		<!--侧导航-->
		<include file="model:right" />
		<script>
            $(".nav-in li:nth-child(3)").addClass("nav-active");
		</script>
		<script>
			$(".zt-qibu-list:nth-child(2n-1) .zt-qibu-in .zt-qibu-in1").addClass("slideInLeft");
			$(".zt-qibu-list:nth-child(2n-1) .zt-qibu-in .zt-qibu-in2").addClass("slideInRight");
			$(".zt-qibu-list:nth-child(2n) .zt-qibu-in .zt-qibu-in1").addClass("slideInRight");
			$(".zt-qibu-list:nth-child(2n) .zt-qibu-in .zt-qibu-in2").addClass("slideInLeft");
		</script>
		
	</body>

</html>
